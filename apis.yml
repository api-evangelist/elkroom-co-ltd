name: ELKROOM CO., LTD.
description: >-
  ELKROOM CO., LTD. is a consumer mobile-gaming studio and 500 Global portfolio
  company behind the OXO product family. Its flagship OXO Game Launcher is an
  Android game launcher and optimization tool that organizes a player's games and
  automatically tracks play history, journals, monthly reports, rankings, and
  community activity, and has surpassed five million downloads on Google Play. The
  company also builds OXO Gameplay, an AI-powered gaming content and social
  platform for Android and iOS, and Stricer, a cloud-based AI video analysis and
  highlight-editing tool on the web. ELKROOM operates consumer applications rather
  than a public developer API; this profile captures its public identity, product
  surface, and legal/policy pages. Tagline: "You Chase Glory. We Make It Legendary."
